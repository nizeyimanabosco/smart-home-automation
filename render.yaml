databases:
  - name: smart-home-db
    databaseName: smart_home
    user: smart_home_user
    plan: free

services:
  - type: web
    name: smart-home-api
    runtime: node
    rootDir: smart-home-automation/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-home-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY_1
        generateValue: true
      - key: DEVICE_API_KEY_2
        generateValue: true
      - key: DEVICE_API_KEY_3
        generateValue: true
      - key: CONTROL_USERNAME
        sync: false
      - key: CONTROL_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
